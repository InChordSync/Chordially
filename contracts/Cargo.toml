# Shared workspace. The existing contract crates are still standalone (each declares its own
# `[workspace]`), so only crates listed here are built, linted and tested through it.
[workspace]
resolver = "2"
members = ["common"]

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
indexing_slicing = "warn"
