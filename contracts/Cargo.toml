[workspace]
resolver = "2"
members = ["hello", "common"]

[workspace.dependencies]
soroban-sdk = "21.7.7"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
indexing_slicing = "warn"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
